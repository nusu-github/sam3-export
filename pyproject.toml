[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "sam3"
version = "0.1.0"
description = "Export-oriented SAM3 building blocks (torch.export subgraphs; ATen defaults)"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-SAM-License"
dependencies = [
  "ftfy>=6.3",
  "numpy>=2.0",
  "pillow>=10.0",
  "regex>=2024.0",
  "scipy>=1.14",
  "torch>=2.7",
  "torchvision>=0.22",
  "timm>=1.0",
  "jaxtyping>=0.2",
  "tensordict>=0.8",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
]

[dependency-groups]
lint = [
  "ruff==0.16.0",
]
typecheck = [
  "pyrefly==1.1.1",
]
test = [
  "pytest==9.1.1",
]
dev = [
  { include-group = "lint" },
  { include-group = "typecheck" },
  { include-group = "test" },
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sam3*"]

[tool.setuptools.package-data]
"sam3.assets" = ["*.gz"]

[tool.pytest]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--import-mode=importlib",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Keep the required gate focused on stable correctness and import rules. The
# project uses jaxtyping's symbolic shape syntax, so annotation parsing is
# handled by Pyrefly rather than Ruff's pyflakes parser.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Ruff interprets symbolic jaxtyping dimensions (for example, "batch seq") as
# Python forward annotations. They are valid at runtime but trigger false
# undefined-name and annotation-parser diagnostics.
"src/sam3/**/*.py" = ["F722", "F821"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["sam3"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"
